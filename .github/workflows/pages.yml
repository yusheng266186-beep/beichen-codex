name: publish-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Require relay origin
        if: ${{ vars.BEICHEN_RELAY_ORIGIN == '' }}
        run: |
          echo "Repository variable BEICHEN_RELAY_ORIGIN is required for a live Pages build."
          exit 1
      - run: npm run verify
        env:
          RELAY_ORIGIN: ${{ vars.BEICHEN_RELAY_ORIGIN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
